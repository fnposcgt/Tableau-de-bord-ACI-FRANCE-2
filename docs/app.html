<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>CGT Reconquête</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Application CGT de reconquête syndicale – terrain, offline, sécurisée." />

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f7f7f7;
    }
    header {
      font-weight: bold;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      margin: 0.25rem 0;
    }
    input {
      padding: 0.4rem;
      width: 100%;
      margin-bottom: 0.5rem;
    }
    .readonly {
      color: darkred;
      font-weight: bold;
    }
    .structure {
      background: white;
      margin: 0.5rem 0;
      padding: 0.5rem;
      border: 1px solid #ccc;
    }
  </style>

  <!-- Supabase CDN -->
  https://unpkg.com/@supabase/supabase-js@2script>
</head>
<body>

<header>
  CGT Reconquête
  <span id="modeInfo"></span>
</header>

<div id="loginAdmin" style="display:none">
  <h3>Admin – Connexion</h3>
  <input id="email" placeholder="Email admin" />
  <input id="password" type="password" placeholder="Mot de passe" />
  <button onclick="loginAdmin()">Connexion</button>
</div>

<div id="app" style="display:none">
  <button onclick="logout()">Déconnexion</button>
  <h3>Structures</h3>
  <div id="structures"></div>

  <button onclick="addStructure()">➕ Ajouter structure (admin)</button>
</div>

<script>
/* ===============================
   CONFIG SUPABASE
================================ */
const SUPABASE_URL = "https://XXXXXX.supabase.co";
const SUPABASE_ANON_KEY = "PUBLIC_ANON_KEY_XXXX";

let supabase;
let isReadonly = false;

/* ===============================
   INIT MODE
================================ */
const params = new URLSearchParams(window.location.search);
isReadonly = params.has('readonly');

document.getElementById('modeInfo').innerHTML = isReadonly
  ? ' — <span class="readonly">MODE READONLY</span>'
  : ' — ADMIN';

/* ===============================
   INIT SUPABASE
================================ */
function initSupabase(session = null) {
  supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    session ? { global: { headers: { Authorization: `Bearer ${session.access_token}` } } } : {}
  );
}

/* ===============================
   AUTH ADMIN
================================ */
async function loginAdmin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email, password
  });

  if (error) {
    alert("Erreur login");
    return;
  }

  localStorage.setItem("adminSession", JSON.stringify(data.session));
  startApp();
}

function logout() {
  localStorage.clear();
  location.reload();
}

/* ===============================
   DATA LOADING
================================ */
async function loadStructures() {
  const { data, error } = await supabase
    .from('structures')
    .select('*')
    .order('updated_at', { ascending: false });

  const container = document.getElementById('structures');
  container.innerHTML = "";

  if (error) {
    container.innerText = "Erreur chargement";
    return;
  }

  data.forEach(s => {
    const div = document.createElement('div');
    div.className = 'structure';
    div.innerHTML = `<strong>${s.nom}</strong><br>${s.commune || ""} — ${s.secteur}`;
    container.appendChild(div);
  });
}

/* ===============================
   ADMIN WRITE
================================ */
async function addStructure() {
  if (isReadonly) return alert("Readonly");

  const nom = prompt("Nom structure");
  if (!nom) return;

  const secteur = prompt("Secteur (ACI, Regie, etc)");
  const commune = prompt("Commune");

  const { error } = await supabase
    .from('structures')
    .insert([{ nom, secteur, commune }]);

  if (error) {
    alert("Écriture refusée");
  } else {
    loadStructures();
  }
}

/* ===============================
   APP START
================================ */
function startApp() {
  document.getElementById('loginAdmin').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadStructures();
}

/* ===============================
   BOOTSTRAP
================================ */
if (isReadonly) {
  initSupabase();
  startApp();
} else {
  const saved = localStorage.getItem("adminSession");
  initSupabase(saved ? JSON.parse(saved) : null);

  if (saved) {
    startApp();
  } else {
    document.getElementById('loginAdmin').style.display = 'block';
  }
}
</script>

</body>
</html>
