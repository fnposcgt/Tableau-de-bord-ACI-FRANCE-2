<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CGT Reconquête – version simple</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 10px;
      background: #f4f4f4;
    }
    h1 {
      font-size: 1.4em;
    }
    .structure {
      background: white;
      border: 1px solid #ccc;
      padding: 8px;
      margin-bottom: 6px;
    }
    input, button {
      padding: 6px;
      margin: 4px 0;
      width: 100%;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>CGT Reconquête – terrain</h1>

<div>
  <input id="nom" placeholder="Nom de la structure">
  <input id="secteur" placeholder="Secteur (ACI, Régie, etc)">
  <input id="commune" placeholder="Commune">
  <button onclick="ajouter()">➕ Ajouter</button>
</div>

<hr>

<div id="liste"></div>

<script>
  // Chargement des données
  let structures = JSON.parse(localStorage.getItem("structures") || "[]");

  function afficher() {
    const liste = document.getElementById("liste");
    liste.innerHTML = "";

    structures.forEach((s, i) => {
      const div = document.createElement("div");
      div.className = "structure";
      div.innerHTML = `
        <strong>${s.nom}</strong><br>
        ${s.secteur} – ${s.commune}<br>
        <button onclick="supprimer(${i})">Supprimer</button>
      `;
      liste.appendChild(div);
    });
  }

  function ajouter() {
    const nom = document.getElementById("nom").value;
    const secteur = document.getElementById("secteur").value;
    const commune = document.getElementById("commune").value;

    if (!nom) {
      alert("Nom obligatoire");
      return;
    }

    structures.push({ nom, secteur, commune });
    localStorage.setItem("structures", JSON.stringify(structures));

    document.getElementById("nom").value = "";
    document.getElementById("secteur").value = "";
    document.getElementById("commune").value = "";

    afficher();
  }

  function supprimer(i) {
    if (!confirm("Supprimer cette structure ?")) return;
    structures.splice(i, 1);
    localStorage.setItem("structures", JSON.stringify(structures));
    afficher();
  }

  afficher();
</script>

</body>
</html>

</head>
<body>

<header>
  CGT Reconquête
  <span id="modeInfo"></span>
</header>

<div id="loginAdmin" style="display:none">
  <h3>Admin – Connexion</h3>
  <input id="email" placeholder="Email admin" />
  <input id="password" type="password" placeholder="Mot de passe" />
  <button onclick="loginAdmin()">Connexion</button>
</div>

<div id="app" style="display:none">
  <button onclick="logout()">Déconnexion</button>
  <h3>Structures</h3>
  <div id="structures"></div>

  <button onclick="addStructure()">➕ Ajouter structure (admin)</button>
</div>

<script>
/* ===============================
   CONFIG SUPABASE
================================ */
const SUPABASE_URL = "https://XXXXXX.supabase.co";
const SUPABASE_ANON_KEY = "PUBLIC_ANON_KEY_XXXX";

let supabase;
let isReadonly = false;

/* ===============================
   INIT MODE
================================ */
const params = new URLSearchParams(window.location.search);
isReadonly = params.has('readonly');

document.getElementById('modeInfo').innerHTML = isReadonly
  ? ' — <span class="readonly">MODE READONLY</span>'
  : ' — ADMIN';

/* ===============================
   INIT SUPABASE
================================ */
function initSupabase(session = null) {
  supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    session ? { global: { headers: { Authorization: `Bearer ${session.access_token}` } } } : {}
  );
}

/* ===============================
   AUTH ADMIN
================================ */
async function loginAdmin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email, password
  });

  if (error) {
    alert("Erreur login");
    return;
  }

  localStorage.setItem("adminSession", JSON.stringify(data.session));
  startApp();
}

function logout() {
  localStorage.clear();
  location.reload();
}

/* ===============================
   DATA LOADING
================================ */
async function loadStructures() {
  const { data, error } = await supabase
    .from('structures')
    .select('*')
    .order('updated_at', { ascending: false });

  const container = document.getElementById('structures');
  container.innerHTML = "";

  if (error) {
    container.innerText = "Erreur chargement";
    return;
  }

  data.forEach(s => {
    const div = document.createElement('div');
    div.className = 'structure';
    div.innerHTML = `<strong>${s.nom}</strong><br>${s.commune || ""} — ${s.secteur}`;
    container.appendChild(div);
  });
}

/* ===============================
   ADMIN WRITE
================================ */
async function addStructure() {
  if (isReadonly) return alert("Readonly");

  const nom = prompt("Nom structure");
  if (!nom) return;

  const secteur = prompt("Secteur (ACI, Regie, etc)");
  const commune = prompt("Commune");

  const { error } = await supabase
    .from('structures')
    .insert([{ nom, secteur, commune }]);

  if (error) {
    alert("Écriture refusée");
  } else {
    loadStructures();
  }
}

/* ===============================
   APP START
================================ */
function startApp() {
  document.getElementById('loginAdmin').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadStructures();
}

/* ===============================
   BOOTSTRAP
================================ */
if (isReadonly) {
  initSupabase();
  startApp();
} else {
  const saved = localStorage.getItem("adminSession");
  initSupabase(saved ? JSON.parse(saved) : null);

  if (saved) {
    startApp();
  } else {
    document.getElementById('loginAdmin').style.display = 'block';
  }
}
</script>

</body>
</html>
